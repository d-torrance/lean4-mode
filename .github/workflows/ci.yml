name: CI

on:
  push:
    branches: [master, eglot]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 29.1 is the floor; 30.1 is the current release; snapshot is an
        # early warning for changes in eglot, jsonrpc and flymake, all of
        # which this package tracks closely.
        emacs_version: ['29.1', '29.4', '30.1']
        experimental: [false]
        include:
          - emacs_version: snapshot
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # Dependencies come from ELPA and change daily, so key the cache on the
      # Emacs version and on the headers that declare them.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .elpa
          key: elpa-${{ matrix.emacs_version }}-${{ hashFiles('lean4-mode.el') }}
          restore-keys: elpa-${{ matrix.emacs_version }}-

      - name: Install dependencies
        run: make deps

      - name: Byte-compile
        run: make compile

      - name: Checkdoc
        run: make checkdoc

      - name: package-lint
        run: make lint

      - name: Test
        run: make test

  # Debian and Ubuntu ship magit-section 3.3.0, this package's declared
  # minimum, and their magit depends on exactly that version -- so a user who
  # installs a newer magit-section to satisfy us breaks their magit.  That
  # makes 3.3.0 a version worth actually testing rather than merely claiming.
  oldest-deps:
    name: magit-section 3.3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: '29.1'

      - name: Install magit-section 3.3.0
        run: sudo apt-get update && sudo apt-get install -y elpa-magit-section

      - name: Locate it
        id: magit
        run: echo "dir=$(ls -d /usr/share/emacs/site-lisp/elpa/magit-section-*)" >> "$GITHUB_OUTPUT"

      - name: Install remaining dependencies
        run: make deps

      - name: Byte-compile
        run: make compile SHADOW=${{ steps.magit.outputs.dir }}

      - name: Test
        run: make test SHADOW=${{ steps.magit.outputs.dir }}

  # The end-to-end suite talks to a real `lake serve'.  It is what catches
  # the things unit tests cannot: what Lean actually sends, and what the
  # goal display actually renders from it.  Kept a separate job because it
  # needs a toolchain and takes minutes rather than seconds.
  e2e:
    name: End-to-end on Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.1']
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # Keyed on the pinned toolchain, so this is a download only when the
      # fixture's lean-toolchain changes.
      - name: Cache elan
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('test/fixture/lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
              | tar xz
            ./elan-init -y --default-toolchain "$(cat test/fixture/lean-toolchain)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: lake --version && lean --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .elpa
          key: elpa-e2e-${{ hashFiles('lean4-mode.el') }}

      - name: Install dependencies
        run: make deps

      - name: End-to-end
        run: make e2e
