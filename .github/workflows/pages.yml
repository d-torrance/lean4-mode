name: Pages

# The manual is generated from README.org, so it is only ever as current as
# the last push to master.  Publishing it from that push means the website
# and the shipped Info manual can never disagree.
on:
  push:
    branches: [master]
    paths:
      - README.org
      - build.el
      - doc/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Enough to publish, and no more.  `actions: read' is what deploy-pages
# needs to fetch the artifact the build job uploaded.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# A run already publishing is left to finish; queued ones collapse into
# the newest, since only the newest would survive anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No dependencies: ox-html is built in, and the export loads none of
      # the package's own libraries.
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      - name: Export the manual
        run: make html

      - uses: actions/configure-pages@v6

      # Dotfiles are left out of the artifact unless asked for, and .nojekyll
      # is one.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
